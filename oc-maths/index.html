  --tone-d:#CDA2F2; --tone-d-bg:#2F1F44; --tone-e:#FF8FAE; --tone-e-bg:#3B1627; color-scheme:dark}}

*{box-sizing:border-box}

.bigstats{display:flex;justify-content:center;gap:28px;flex-wrap:wrap;margin-top:18px} .bigstats div{display:flex;flex-direction:column}

.grid35{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}

.cell.done{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent);font-weight:600} .cell.flag{box-shadow:inset 0 -4px 0 var(--hi)} .cell.cur{border-color:var(--accent);border-width:2.5px}

.modes.two{grid-template-columns:1fr}

.passage{position:relative;max-height:52vh;overflow-y:auto;border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:4px 18px 10px;margin-bottom:16px;font-size:1rem;line-height:1.7;max-width:100%}

/* progress, rewards and shop */
.hero{display:flex;gap:18px;align-items:center}
.hero-koala{flex:none;background:none;border:0;padding:0;cursor:pointer;width:110px;animation:heroWave 3.6s ease-in-out infinite;transform-origin:50% 100%}
.hero-koala svg{width:110px;height:132px;overflow:visible}.hero-koala .keyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes heroWave{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(-6deg)}82%{transform:rotate(5deg)}88%{transform:rotate(-3deg)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.progress-card{display:grid;grid-template-columns:1.2fr 1fr;gap:16px 24px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 20px}
.pc-goal,.pc-tier{display:flex;gap:14px;align-items:center;min-width:0}.pc-tinfo{flex:1;min-width:0}
.pc-big{margin:0;font:600 1.15rem var(--f-display)}.pc-small{margin:4px 0 0;font-size:.85rem;color:var(--ink-soft);display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.pc-actions{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap}.pc-actions .btn{flex:1;min-width:160px;display:flex;justify-content:center;gap:8px;align-items:center}
.count{font-size:.8rem;padding:2px 8px;border-radius:99px;background:var(--hi);color:var(--hi-ink)}
.meter.big{height:12px}
.ring{flex:none}.ring-bg{fill:none;stroke:var(--accent-soft);stroke-width:9}.ring-fg{fill:none;stroke:var(--accent);stroke-width:9;stroke-linecap:round;transition:stroke-dasharray .6s}.ring-fg.full{stroke:var(--ok)}
.ring-n{font:700 22px var(--f-display);fill:var(--ink)}.ring-d{font:500 10px var(--f-body);fill:var(--ink-soft)}
.chart .bar{fill:var(--shade)}.chart .bar-met{fill:var(--ok)}.goal-line{stroke:var(--ok);stroke-dasharray:4 4;stroke-width:1.5}
.ladder{list-style:none;padding:0;margin:16px 0 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.ladder li,.tmedals li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;border:1px solid var(--line);min-width:0}
.ladder li span,.tmedals li span{display:flex;flex-direction:column;min-width:0}.ladder small,.tmedals small,.badges small{color:var(--ink-soft);font-size:.78rem}
.ladder li.cur{border:2px solid var(--accent);background:var(--accent-soft);animation:glow 2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 6px var(--accent-soft)}}
.badges{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.badges li{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:12px 8px;border-radius:14px;border:1px solid var(--line)}
.badges li.got{background:var(--hint-bg);border-color:var(--hint-line)}.badges li.got .medal{animation:medalBob 3s ease-in-out infinite}
@keyframes medalBob{50%{transform:translateY(-3px) rotate(-3deg)}}
.tmedals{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.medal.locked{opacity:.75}.tile-medal{display:inline-block;vertical-align:-4px;margin-left:6px}
.shop-head{display:flex;gap:18px;align-items:center}.shop-me svg{width:130px;height:156px;overflow:visible}
.shop{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.shop-item{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px;border-radius:14px;border:1px solid var(--line)}.shop-item.on{border:2px solid var(--ok);background:var(--ok-bg)}
.shop-koala svg{width:96px;height:115px;overflow:visible}.shop-item:hover .shop-koala{animation:heroWave 1.2s ease-in-out}
.combo{display:inline-flex;align-items:center;gap:4px;font-size:.8rem;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--hint-bg);color:var(--ink);animation:rightpop .4s}
.qcard.enter{animation:slideIn .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes slideIn{from{transform:translateX(30px)}to{transform:none}}
.choice.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.starcount{display:inline-block}.starcount.bump{animation:bump .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{40%{transform:scale(1.45)}}
.flystar{position:absolute;margin:-11px 0 0 -11px;animation:fly 1s cubic-bezier(.5,-.3,.7,1) forwards}
@keyframes fly{0%{transform:translate(0,0) scale(.6)}20%{transform:translate(calc(var(--tx)*.1),-40px) scale(1.3)}100%{transform:translate(var(--tx),var(--ty)) scale(.5);opacity:.9}}
.badge-pop{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%)}
.badge-in{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--card);border:3px solid #18224A;border-radius:22px;padding:18px 28px;box-shadow:0 8px 0 #18224A;animation:badgeIn 2.9s cubic-bezier(.3,1.5,.5,1) forwards;text-align:center}
.badge-in p{margin:6px 0 0;font:600 .95rem var(--f-display);color:var(--ink-soft)}.badge-in b{font:700 1.4rem var(--f-display);color:var(--ink)}
.badge-in .medal{animation:spinIn .9s cubic-bezier(.3,1.4,.5,1)}
@keyframes badgeIn{0%{transform:scale(.2) rotate(-12deg);opacity:0}14%{transform:scale(1.08) rotate(2deg);opacity:1}22%{transform:scale(1) rotate(0)}86%{transform:scale(1);opacity:1}100%{transform:scale(.8);opacity:0}}
@keyframes spinIn{from{transform:rotateY(540deg) scale(.4)}to{transform:none}}
.btn:active,.choice:active:not(:disabled),.topic:active,.mode:active,.padk:active{transform:scale(.97)}
.topic,.mode{transition:transform .12s,border-color .12s}

.bubble{background:var(--card);color:var(--ink);border:2px solid var(--ink);border-radius:16px;padding:8px 12px;font:600 1rem/1.3 var(--f-display);max-width:240px;margin:0 24px 8px 0;position:relative;box-shadow:0 4px 0 var(--ink)}

.roo{position:absolute;left:0;bottom:env(safe-area-inset-bottom,0px);animation:roox 3.2s linear forwards}
.roo-in{animation:rooy .53s ease-in-out infinite}
@keyframes roox{from{transform:translateX(-130px)}to{transform:translateX(calc(100vw + 30px))}}
@keyframes rooy{0%,100%{transform:translateY(0)}50%{transform:translateY(-70px)}}
.spark{position:absolute;margin:-9px 0 0 -9px;animation:spark .8s ease-out forwards}
